name: KIP Infrastructure Implementation Guide publish pipeline

on:
  workflow_dispatch: # Enable manual run
  push:
    branches: [ main ]
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ main ]

env:
  APP_AUTHOR_NAME: "KIP-ig-publisher[bot]"
  APP_AUTHOR_EMAIL: "kip-ig-publisher[bot]@users.noreply.github.com"
  IG_REPO: implementation-guide
  REGISTRY_REPO: ig-registry
  WEB_REPO: kip-ig-website
  WEB_APP_LOCATION: "web/"

# No GITHUB_TOKEN permissions by default, every job grants itself what it needs.
# Publishing to the other repositories runs on the app token, not GITHUB_TOKEN.
permissions: {}

jobs:
  # Check if the IG transpiles without errors
  check-transpile:
    name: Transpile IG
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    container: ghcr.io/trifork/ig-publisher:latest
    permissions:
      contents: read

    steps:
      # Checkout the repos needed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: IG transpile check
        uses: trifork/ig-publisher/.github/actions/ig-transpile@576011684bac9bd331150f4c78a1e2bed28c02fe # v2.3.3

  # Warn when a changed .fsh file has not had its "* ^date = ..." updated in the
  # PR. Advisory only, this job does not block the pull request.
  check-fsh-dates:
    name: Check FSH dates
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base commit is available for diffing, and
          # check out the PR head itself so the working tree holds the authored files.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Warn if ^date was not bumped on changed FSH files
        uses: ./.github/actions/check-fsh-dates
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}

  # Transpile and publish the IG, if it was pushed to main with a tag
  release:
    name: Transpile and publish to the IG release
    # A release is defined as a tag pushed to main
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    container: ghcr.io/trifork/ig-publisher:latest
    permissions:
      contents: read

    steps:
      # Checkout the repos needed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ig

      - name: Set Sushi config release YAML properties
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          valueFile: ig/sushi-config.yaml
          commitChange: false
          createPR: false
          changes: |
            {
              "version": "${{ github.ref_name }}",
              "releaseLabel": "release"
            }

      - name: Update publication-request.json with the release version
        shell: bash
        run: |
          # Write via a temp file rather than `echo "$(jq ...)" > file`: command
          # substitution failures do not trip `set -e`, so that idiom silently
          # truncates the file to an empty line and lets the release continue.
          set -euo pipefail
          jq --arg v "$GITHUB_REF_NAME" '
            .version = $v |
            .path = "https://kip.rkkp.dk/fhir/" + $v |
            .desc = "KIP Infrastructure version " + $v
          ' ig/publication-request.json > ig/publication-request.json.tmp
          mv ig/publication-request.json.tmp ig/publication-request.json

      - name: Print edited config files
        run: |
          echo "======================== sushi-config.yaml        ========================"
          cat ig/sushi-config.yaml
          echo -n "\n\n======================== publication-request.json ========================\n"
          cat ig/publication-request.json

      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.IG_REPO }},${{ env.WEB_REPO }},${{ env.REGISTRY_REPO }}

      - name: Publish the implementation guide
        uses: trifork/ig-publisher/.github/actions/ig-publish@576011684bac9bd331150f4c78a1e2bed28c02fe # v2.3.3
        # uses: ../../trifork/ig-publisher/.github/actions/ig-publish # Test local action
        with:
          app-token: ${{ steps.token.outputs.token }}
          app-author-name: ${{ env.APP_AUTHOR_NAME }}
          app-author-email: ${{ env.APP_AUTHOR_EMAIL }}
          registry-repo: ${{ github.repository_owner }}/${{ env.REGISTRY_REPO }}
          web-repo: ${{ github.repository_owner }}/${{ env.WEB_REPO }}
          web-source: ${{ env.WEB_APP_LOCATION }}

      # The tag is cut before the version is bumped, so main still carries the
      # previous version at this point. Now that the publication succeeded,
      # write the released version back to main.
      #
      # This uses a fresh checkout of main rather than the `ig` tree above: that
      # one is a detached checkout of the tag, it has releaseLabel flipped to
      # "release" (main must keep "ci-build"), and it is full of publisher build
      # output.
      - name: Check out main for the version bump
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          token: ${{ steps.token.outputs.token }}

      - name: Commit the released version to main
        working-directory: main
        shell: bash
        env:
          V: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Only the version, deliberately not releaseLabel. A line-level edit
          # rather than `yq -i`, which rewrites the whole document and strips
          # the file's blank-line grouping. `^version:` is unique here
          # (fhirVersion has a capital V); the grep fails the job loudly if that
          # ever stops being true rather than releasing an unbumped main.
          sed -i -E "s|^version: .*|version: ${V}|" sushi-config.yaml
          grep -qx "version: ${V}" sushi-config.yaml

          jq --arg v "$V" '
            .version = $v |
            .path = "https://kip.rkkp.dk/fhir/" + $v |
            .desc = "KIP Infrastructure version " + $v
          ' publication-request.json > publication-request.json.tmp
          mv publication-request.json.tmp publication-request.json

          if git diff --quiet -- sushi-config.yaml publication-request.json; then
            echo "main is already at $V, nothing to commit"
            exit 0
          fi

          git config user.name "$APP_AUTHOR_NAME"
          git config user.email "$APP_AUTHOR_EMAIL"
          git add sushi-config.yaml publication-request.json
          git commit -m "chore(release): 🔖 bump version to $V"
          git push origin HEAD:main
